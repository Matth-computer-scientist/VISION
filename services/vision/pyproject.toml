[project]
name = "vision-service"
version = "0.1.0"
description = "FastAPI AI service layer for Vision Suite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
