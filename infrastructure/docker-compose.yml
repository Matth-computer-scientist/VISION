services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      VISION_API_PORT: 8080
      VISION_API_BASE_URL: http://api:8080
      VISION_AI_SERVICE_URL: http://vision-service:8001
      VISION_ADMIN_EMAIL: admin@vision.local
      VISION_ADMIN_PASSWORD: vision123
      VISION_ADMIN_TOKEN: vision-demo-token
      VISION_WORKER_TOKEN: vision-worker-secret
      VISION_UPLOAD_ROOT: /workspace/assets/uploads
      VISION_OUTPUT_ROOT: /workspace/assets/outputs
      VISION_DATA_ROOT: /workspace/backend/data
      RUST_LOG: vision_api=info,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - minio
      - vision-service
    volumes:
      - ../assets:/workspace/assets
      - ../backend/data:/workspace/backend/data
    restart: unless-stopped

  vision-service:
    build:
      context: ..
      dockerfile: services/vision/Dockerfile
    environment:
      VISION_WORKER_TOKEN: vision-worker-secret
      VISION_SERVICE_PORT: 8001
      VISION_SERVICE_FFMPEG_BIN: ffmpeg
      VISION_SERVICE_FFMPEG_CMD: "\"{ffmpeg_bin}\" -y -i \"{input}\" \"{output}\""
      VISION_SERVICE_FFMPEG_IMAGE_UPSCALE_CMD: "\"{ffmpeg_bin}\" -y -i \"{input}\" -vf \"scale=iw*{scale}:ih*{scale}:flags=lanczos\" \"{output}\""
      VISION_SERVICE_FFMPEG_VIDEO_UPSCALE_CMD: "\"{ffmpeg_bin}\" -y -i \"{input}\" -vf \"scale=iw*{scale}:ih*{scale}:flags=lanczos\" -c:v libx264 -pix_fmt yuv420p \"{output}\""
      VISION_SERVICE_FFMPEG_VIDEO_TRANSCODE_CMD: "\"{ffmpeg_bin}\" -y -i \"{input}\" -c:v libx264 -pix_fmt yuv420p \"{output}\""
      VISION_SERVICE_REAL_ESRGAN_CMD: realesrgan-ncnn-vulkan -i "{input}" -o "{output}" -s {scale}
      VISION_SERVICE_GFPGAN_CMD: python inference_gfpgan.py -i "{input}" -o "{output_dir}"
      VISION_SERVICE_U2NET_CMD: rembg i "{input}" "{output}"
      VISION_SERVICE_RIFE_CMD: python inference_video.py --video "{input}" --output "{output}"
      VISION_SERVICE_LAMA_CMD: python run_inpainting.py --image "{input}" --mask "{mask}" --output "{output}"
      VISION_SERVICE_INSIGHTFACE_CMD: python run_faceswap.py --target "{input}" --source "{source}" --output "{output}"
      VISION_SERVICE_DEOLDIFY_CMD: python run_colorization.py --input "{input}" --output "{output}"
      VISION_SERVICE_SCUNET_CMD: python run_denoise.py --input "{input}" --output "{output}"
      VISION_SERVICE_SAM_CMD: python run_segmentation.py --input "{input}" --output "{output}"
      VISION_SERVICE_JOB_TIMEOUT_SECONDS: 600
      VISION_SERVICE_MAX_INPUT_SIZE_MB: 512
    ports:
      - "8001:8001"
    volumes:
      - ../assets:/workspace/assets
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
